name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Least privilege: the build only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: audioverse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Also validates the Gradle wrapper jar checksum.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore stable debug keystore (optional secret)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore
            echo "Using stable debug keystore"
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret; using a throwaway debug key"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Remove keystore from workspace
        if: always()
        run: rm -rf keystore

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: audioverse-debug-apk
          path: audioverse/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: audioverse/**/build/reports/tests/
          retention-days: 7

  emulator-gate:
    # Plays bundled test tones through the real engine on an Android 14 emulator.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run engine gate on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: audioverse
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          disable-animations: true
          script: chmod +x gradlew && (./gradlew --no-daemon connectedDebugAndroidTest || touch gate_failed) ; adb logcat -d -v raw -s AV_GATE:I > gate_report.txt || true ; echo "::notice title=AudioVerse emulator gate report::$(tr '\n' '|' < gate_report.txt)" ; test ! -f gate_failed

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-gate-reports
          path: |
            audioverse/app/build/reports/androidTests/
            audioverse/gate_report.txt
          retention-days: 7

  # Publishes the tested APK as a direct download (phone-friendly, no zip, no login):
  # https://github.com/<owner>/<repo>/releases/download/gate-latest/AudioVerse-gate.apk
  publish-apk:
    needs: [build, emulator-gate]
    # Held until the on-device checklist (U15) and release-candidate gate (U23) pass:
    # set the repository variable PUBLISH_APK=true to publish (Council ruling, 2026-11-26).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_APK == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # only this job may create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audioverse-debug-apk
          path: apk

      - name: Replace the gate-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv apk/*.apk apk/AudioVerse-gate.apk
          gh release delete gate-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create gate-latest apk/AudioVerse-gate.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "AudioVerse gate build (latest)" \
            --notes "Debug build of commit $GITHUB_SHA. Passed unit tests and the emulator engine gate. Personal sideload only."
