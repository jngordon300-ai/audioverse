<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  AudioVerse · Transmission — browser edition (Mac Mini / laptop).
  One file, no server, no accounts, no trackers. Scripts are all inline (no CDN).
  Network use: only the stations, playlists and YouTube embeds you choose to play.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src * blob: data:; connect-src * blob: data:; worker-src blob:; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>AudioVerse · Transmission</title>
<style>
:root{--g:#0E0F12;--s:#181A1F;--s2:#22252C;--l:#2A2D35;--t:#F2F2F0;--m:#A3A7B0;--a:#F5A524;--oa:#1A1205;--w:#FFB4A8}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--g);color:var(--t);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--s);border:1px solid var(--l);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--a)}button.pri{background:var(--a);color:var(--oa);border-color:var(--a);font-weight:600}
button.link{background:none;border:none;color:var(--a);padding:4px 6px}button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=search],input[type=password],textarea{background:var(--s);border:1px solid var(--l);border-radius:10px;padding:8px 10px;width:100%;color:var(--t)}
textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
input[type=range]{accent-color:var(--a);width:100%}
#app{display:grid;grid-template-columns:200px 1fr;grid-template-rows:1fr auto;height:100vh}
nav{grid-row:1/3;background:#0b0c0f;border-right:1px solid var(--l);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:17px;margin:0 6px 14px;line-height:1.2}nav h1 small{display:block;color:var(--a);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
nav button{text-align:left;background:none;border:none;border-radius:8px;padding:9px 10px;color:var(--m)}
nav button.on{background:var(--s);color:var(--a)}nav .foot{margin-top:auto;color:var(--m);font-size:11px;padding:6px}
main{overflow:auto;padding:22px 28px}
h2{font-size:26px;margin:0 0 2px}.sub{color:var(--m);font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--s);border:1px solid var(--l);border-radius:999px;padding:5px 12px;color:var(--m);cursor:pointer;font-size:13px}
.chip.on{background:var(--a);color:var(--oa);border-color:var(--a)}
.list{margin-top:8px}.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--s)}.item.on{background:var(--s2)}.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{color:var(--m);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item.on .t{color:var(--a)}
.badge{color:var(--a);font-size:11px;font-weight:700}.mut{color:var(--m)}.warn{color:var(--w)}.amber{color:var(--a)}
.card{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:14px;margin:10px 0}
.icon{background:none;border:none;color:var(--a);padding:2px 6px;font-size:15px}
footer{grid-column:2;background:#0b0c0f;border-top:1px solid var(--l);padding:10px 20px;display:flex;gap:14px;align-items:center}
footer .np{width:260px;min-width:0}footer .np .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer .np .d{color:var(--m);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:var(--m);font-size:12px;font-variant-numeric:tabular-nums;width:44px;text-align:center}
video{width:100%;max-height:60vh;background:#000;border-radius:12px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.deck{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:14px}.deck.play{border-color:var(--a)}
.deck h3{margin:0;color:var(--a);font-size:12px;letter-spacing:.1em}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
.modal>div{background:var(--s);border:1px solid var(--l);border-radius:16px;padding:18px;width:min(560px,92vw);max-height:84vh;display:flex;flex-direction:column}
.modal .list{overflow:auto}
@media (max-width:760px){#app{grid-template-columns:1fr}nav{grid-row:auto;flex-direction:row;overflow:auto;padding:8px}nav h1,nav .foot{display:none}footer{grid-column:1;flex-wrap:wrap}.decks{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <h1><small>AudioVerse</small>Transmission</h1>
    <button data-tab="library">Library</button>
    <button data-tab="radio">Radio</button>
    <button data-tab="tv">TV</button>
    <button data-tab="dj">DJ</button>
    <button data-tab="watch">Watch</button>
    <div class="foot">Browser edition · v0.12<br>Runs locally. Nothing is uploaded.</div>
  </nav>
  <main id="main"></main>
  <footer>
    <div class="np"><div class="t" id="npT">Nothing playing</div><div class="d" id="npD">Pick a song or a station</div></div>
    <button class="icon" id="bPrev" title="Previous">⏮</button>
    <button class="pri" id="bPlay">Play</button>
    <button class="icon" id="bNext" title="Next">⏭</button>
    <span class="time" id="tPos">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" class="grow">
    <span class="time" id="tDur">0:00</span>
    <span class="mut">Vol</span><input type="range" id="vol" min="0" max="100" value="90" style="width:90px">
  </footer>
</div>
<audio id="main-audio" preload="none"></audio>
<div id="modal"></div>

<script>
/*__HLS__*/
</script>
<script>
/*__MPEGTS__*/
</script>
<script>
"use strict";
const CATALOG = /*__STATIONS__*/;
const PRESETS = [
  ["Free · US","https://iptv-org.github.io/iptv/countries/us.m3u"],
  ["Free · By category","https://iptv-org.github.io/iptv/index.category.m3u"],
  ["Free · Worldwide","https://iptv-org.github.io/iptv/index.m3u"],
  ["Free-TV","https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"],
  ["Pluto TV US","https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plutotv_us.m3u"],
  ["Samsung TV Plus US","https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/samsungtvplus_us.m3u"]
].map(([name,url],i)=>({id:"p"+i,name,url,preset:true}));
const RADIO_CATS = [["featured","Featured"],["all","All radio"],["philly","Philly"],["hiphop","Hip-Hop"],["rnb","R&B"],["gospel","Gospel"],["jazz","Jazz"],["talk","Talk"],["hbcu","HBCU"],["college","College"],["internet","Internet"],["diaspora-afrobeats","Afrobeats"],["diaspora-amapiano","Amapiano"],["diaspora-reggae","Reggae"],["diaspora-uk","UK"],["morning","Morning shows"],["pods","Podcasts"],["siriusxm","SiriusXM"]];
const WATCH_CATS = new Set(["musictv","wrestling","comedy"]);
const AUDIO_EXT = new Set("mp3 flac opus ogg oga m4a aac wav aif aiff alac wma".split(" "));
const VIDEO_EXT = new Set("mp4 m4v mkv webm mov".split(" "));
const ADULT = /(^|[^a-z])(xxx|adult|porn|18\+)([^a-z]|$)/i;

// ---------------- helpers ----------------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return isFinite(s) ? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` : "LIVE"; };
const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const isWeb = u => /^https?:\/\//i.test(u || "");
function openExternal(url){ if (isWeb(url)) window.open(url, "_blank", "noopener,noreferrer"); }

// ---------------- state ----------------
const S = {
  tab: store.get("av.tab", "library"),
  songs: [], videos: [], folderNames: [], scanning: "",
  lib: { view: "songs", group: null, q: "" },
  playlists: store.get("av.playlists", [{ id: 1, name: "Favorites", items: [] }]),
  radio: { cat: "featured", q: "" },
  queue: [], qi: -1,
  // IPTV links are session-only (Council U29): nothing with a login is ever written to browser storage.
  tv: { sources: [], freeOn: store.get("av.tv.free", false), sel: null, channels: [], group: null, q: "", loading: false, err: "", playing: null, showAdult: store.get("av.tv.adult", false), hidden: 0 },
  dj: { fader: 0, curve: "power", fadeSec: 8, fading: false },
  watch: { yt: null, video: null }
};
try { localStorage.removeItem("av.tv.sources"); } catch {} // wipe links saved by older versions' "Remember"
const stations = CATALOG.stations.filter(s => isWeb(s.url));
const savePlaylists = () => store.set("av.playlists", S.playlists);

// ---------------- library (folders on this computer) ----------------
const idb = (() => {
  let db; const open = () => db ? Promise.resolve(db) : new Promise((res, rej) => {
    const r = indexedDB.open("audioverse", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(db = r.result); r.onerror = () => rej(r.error); });
  return {
    get: async k => (await open(), new Promise(r => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(undefined); })),
    set: async (k, v) => (await open(), new Promise(r => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = r; t.onerror = r; }))
  };
})();

function songFromFile(file, path){
  const parts = path.split("/"); const name = parts.pop();
  const base = name.replace(/\.[^.]+$/, "");
  let artist = parts.length >= 2 ? parts[parts.length - 2] : "Unknown artist";
  let album = parts.length >= 1 ? parts[parts.length - 1] : "";
  let title = base.replace(/^\d{1,3}[\s.\-_]+/, "");
  const m = title.match(/^(.+?)\s+-\s+(.+)$/); if (m) { artist = m[1]; title = m[2]; }
  return { id: path, file, title, artist, album, path };
}

async function* walkHandle(dir, prefix, depth = 0){
  for await (const [name, h] of dir.entries()) {
    if (name.startsWith(".")) continue;
    if (h.kind === "directory") { if (depth < 12) yield* walkHandle(h, prefix + name + "/", depth + 1); }
    else yield [h, prefix + name];
  }
}

async function scanHandles(handles){
  const songs = [], videos = [];
  for (const dir of handles) {
    let n = 0;
    for await (const [h, path] of walkHandle(dir, dir.name + "/")) {
      const ext = path.split(".").pop().toLowerCase();
      if (!AUDIO_EXT.has(ext) && !VIDEO_EXT.has(ext)) continue;
      if (++n % 50 === 0) { S.scanning = `Scanning ${dir.name} · ${n} files`; render(); }
      const file = await h.getFile();
      if (AUDIO_EXT.has(ext)) songs.push(songFromFile(file, path)); else videos.push({ name: file.name, file, folder: dir.name });
    }
  }
  return { songs, videos };
}

async function addFolder(){
  if (window.showDirectoryPicker) {
    try {
      const dir = await showDirectoryPicker({ mode: "read", id: "audioverse-music" });
      let saved = []; try { saved = (await idb.get("folders")) || []; } catch {}
      saved.push(dir); try { await idb.set("folders", saved); } catch {}
      await rescan(true);
    } catch (e) { /* cancelled */ }
  } else $("#dirInput").click();
}

async function rescan(withPrompt){
  let handles = [];
  try { handles = (await idb.get("folders")) || []; } catch { handles = []; }
  const ok = [];
  for (const h of handles) {
    let p = await h.queryPermission?.({ mode: "read" });
    if (p !== "granted" && withPrompt) p = await h.requestPermission?.({ mode: "read" });
    if (p === "granted") ok.push(h);
  }
  S.folderNames = handles.map(h => h.name); S.needsReconnect = ok.length < handles.length;
  S.scanning = ok.length ? "Scanning…" : ""; render();
  const r = await scanHandles(ok);
  S.songs = r.songs.sort((a, b) => a.artist.localeCompare(b.artist) || a.album.localeCompare(b.album) || a.path.localeCompare(b.path));
  S.videos = r.videos; S.scanning = ""; render();
}

function filesPicked(list){
  const songs = [], videos = [];
  for (const f of list) {
    const path = f.webkitRelativePath || f.name; const ext = path.split(".").pop().toLowerCase();
    if (AUDIO_EXT.has(ext)) songs.push(songFromFile(f, path)); else if (VIDEO_EXT.has(ext)) videos.push({ name: f.name, file: f, folder: path.split("/")[0] });
  }
  S.songs = S.songs.concat(songs); S.videos = S.videos.concat(videos);
  S.folderNames = [...new Set(S.folderNames.concat(songs.concat(videos).map(x => (x.path || x.folder || "").split("/")[0])))];
  render();
}

// ---------------- items & playback ----------------
const songItem = s => ({ kind: "song", key: "song:" + s.id, title: s.title, sub: `${s.artist}${s.album ? " · " + s.album : ""}`, song: s });
const stationItem = st => ({ kind: "station", key: "st:" + st.url, title: st.name, sub: st.city || "Live radio", url: st.url, live: true });
function resolve(entry){ // playlist entry -> item (songs only when their folder is loaded)
  if (entry.kind === "station") return stationItem({ name: entry.title, city: entry.sub, url: entry.url });
  const s = S.songs.find(x => x.id === entry.id); return s ? songItem(s) : null;
}
const toEntry = it => it.kind === "station" ? { kind: "station", key: it.key, title: it.title, sub: it.sub, url: it.url } : { kind: "song", key: it.key, id: it.song.id, title: it.title, sub: it.sub };

const audio = $("#main-audio"); audio.volume = .9; let objUrl = null;
function srcFor(it){
  if (it.kind === "station") return it.url;
  if (objUrl) URL.revokeObjectURL(objUrl);
  return objUrl = URL.createObjectURL(it.song.file);
}
function playQueue(items, i){
  if (!items[i]) return; S.queue = items; S.qi = i; startCurrent();
}
function startCurrent(){
  const it = S.queue[S.qi]; if (!it) return;
  pauseOthers("main");
  audio.src = srcFor(it); audio.play().catch(e => setNp(it, "Can't play this (" + (e.name || "error") + ")"));
  setNp(it); render();
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: it.title, artist: it.sub, album: it.live ? "Live radio" : "AudioVerse" });
  }
}
function setNp(it, err){ $("#npT").textContent = it ? it.title : "Nothing playing"; $("#npD").textContent = err || (it ? (it.live ? "● LIVE · " : "") + it.sub : ""); }
function step(d){ if (!S.queue.length) return; S.qi = (S.qi + d + S.queue.length) % S.queue.length; startCurrent(); }
audio.addEventListener("ended", () => step(1));
audio.addEventListener("play", () => $("#bPlay").textContent = "Pause");
audio.addEventListener("pause", () => $("#bPlay").textContent = "Play");
audio.addEventListener("error", () => setNp(S.queue[S.qi], "Can't play this stream or file"));
audio.addEventListener("timeupdate", () => {
  const live = !isFinite(audio.duration);
  $("#tPos").textContent = fmt(audio.currentTime); $("#tDur").textContent = live ? "LIVE" : fmt(audio.duration);
  if (!seeking) $("#seek").value = live ? 0 : (audio.currentTime / audio.duration * 1000) || 0;
});
let seeking = false;
$("#seek").addEventListener("input", () => seeking = true);
$("#seek").addEventListener("change", e => { seeking = false; if (isFinite(audio.duration)) audio.currentTime = e.target.value / 1000 * audio.duration; });
$("#vol").addEventListener("input", e => audio.volume = e.target.value / 100);
$("#bPlay").onclick = () => { if (!audio.src) { if (S.queue.length) startCurrent(); return; } audio.paused ? (pauseOthers("main"), audio.play()) : audio.pause(); };
$("#bPrev").onclick = () => audio.currentTime > 3 && isFinite(audio.duration) ? audio.currentTime = 0 : step(-1);
$("#bNext").onclick = () => step(1);
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
  navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
}
/** One thing at a time, except the two DJ decks which mix. */
function pauseOthers(who){
  if (who !== "main") audio.pause();
  if (who !== "tv") { const v = $("#tvVideo"); v && v.pause(); }
  if (who !== "watch") { const v = $("#watchVideo"); v && v.pause(); if (S.watch.yt) { S.watch.yt = null; } }
  if (who !== "dj") DJ.decks.forEach(d => d.el.pause());
}
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); $("#bPlay").click(); }
});

// ---------------- playlists ----------------
function inList(pid, key){ return S.playlists.find(p => p.id === pid)?.items.some(e => e.key === key); }
function toggleFav(it){
  const fav = S.playlists[0];
  fav.items = inList(1, it.key) ? fav.items.filter(e => e.key !== it.key) : fav.items.concat(toEntry(it));
  savePlaylists(); render();
}
function addToPlaylist(it){
  modal(`<h3>Add to playlist</h3><div class="mut">${esc(it.title)}</div><div class="list">${S.playlists.map(p =>
    `<div class="item" data-act="pladd" data-p="${p.id}"><div class="grow t">${esc(p.name)}</div><span class="mut">${inList(p.id, it.key) ? "added" : p.items.length}</span></div>`).join("")}</div>
    <div class="row" style="margin-top:8px"><input type="text" id="newPl" placeholder="New playlist" maxlength="40" class="grow"><button data-act="plnew">Create & add</button><button data-act="close">Close</button></div>`);
  S.pending = it;
}

// ---------------- radio ----------------
function radioView(){
  const { cat, q } = S.radio; let list;
  if (cat === "featured") list = CATALOG.featured.map(n => stations.find(s => s.name === n)).filter(Boolean);
  else if (cat === "all") list = stations.filter(s => s.type === "audio");
  else list = stations.filter(s => s.cat === cat && (!WATCH_CATS.has(s.cat) || s.type === "audio"));
  const qq = q.trim().toLowerCase();
  if (qq) list = (cat === "featured" ? stations : list).filter(s => (s.name + " " + s.city + " " + s.tags).toLowerCase().includes(qq));
  return list;
}

// ---------------- TV (M3U) ----------------
function parseM3U(text){
  const out = []; let name = null, group = null, grp = null, ua = null;
  for (let raw of text.split(/\r?\n/)) {
    const line = raw.trim().replace(/^﻿/, ""); if (!line) continue;
    if (/^#EXTINF/i.test(line)) {
      const body = line.slice(line.indexOf(":") + 1); let inQ = false, c = -1;
      for (let i = 0; i < body.length; i++) { if (body[i] === '"') inQ = !inQ; else if (body[i] === "," && !inQ) { c = i; break; } }
      const head = c >= 0 ? body.slice(0, c) : body; const title = c >= 0 ? body.slice(c + 1).trim() : "";
      const attrs = {}; head.replace(/([A-Za-z0-9_-]+)="([^"]*)"/g, (_, k, v) => attrs[k.toLowerCase()] = v.trim());
      name = title || attrs["tvg-name"] || ""; group = attrs["group-title"] || null;
    } else if (/^#EXTGRP:/i.test(line)) grp = line.slice(8).trim() || null;
    else if (line.startsWith("#")) continue;
    else if (isWeb(line)) {
      if (out.length >= 100000) break;
      out.push({ i: out.length, name: name || `Channel ${out.length + 1}`, url: line, group: group || grp || "Other" });
      name = group = grp = null;
    } else { name = group = grp = null; }
  }
  return out;
}
async function tvSelect(id){
  const src = PRESETS.concat(S.tv.sources).find(s => s.id === id); if (!src) return;
  Object.assign(S.tv, { sel: id, loading: true, err: "", channels: [], group: null, q: "" }); render();
  try {
    let text = src.text;
    if (!text) {
      const r = await fetch(src.url, { credentials: "omit", referrerPolicy: "no-referrer" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      text = await r.text();
    }
    const all = parseM3U(text);
    const kept = S.tv.showAdult ? all : all.filter(c => !ADULT.test(c.group));
    Object.assign(S.tv, { channels: kept, hidden: all.length - kept.length, loading: false, err: kept.length ? "" : "No channels found" });
  } catch (e) {
    S.tv.loading = false;
    S.tv.err = /HTTP/.test(e.message) ? `The provider answered ${e.message}.` :
      "Couldn't load this list in the browser. Provider links often block browsers (CORS) or use http on an https page. The free lists work; for a provider list, download the .m3u and use Open file, or use the Android app.";
  }
  render();
}
let hls = null, mts = null;
function tvStop(){ try { hls && hls.destroy(); } catch {} try { mts && (mts.unload(), mts.detachMediaElement(), mts.destroy()); } catch {} hls = mts = null; }
function tvPlay(ch){
  S.tv.playing = ch; render();
  const v = $("#tvVideo"); tvStop(); pauseOthers("tv");
  const url = ch.url, isTs = /\.ts(\?|$)/i.test(url), isHls = /\.m3u8(\?|$)/i.test(url);
  const fail = msg => { S.tv.perr = msg; const e = $("#tvErr"); if (e) e.textContent = msg; };
  S.tv.perr = "";
  if (!isTs && v.canPlayType("application/vnd.apple.mpegurl")) { v.src = url; v.play().catch(() => {}); return; } // Safari: native HLS
  const tryHls = () => {
    if (!window.Hls || !Hls.isSupported()) return fail("This browser can't play HLS streams.");
    hls = new Hls({ lowLatencyMode: true }); hls.loadSource(url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));

    case "fav": toggleFav(S.tab === "radio" ? radIt() : libIt()); break;
    case "add": addToPlaylist(S.tab === "radio" ? radIt() : libIt()); break;
    case "pladd": { const p = S.playlists.find(p => p.id === +el.dataset.p); if (p && !inList(p.id, S.pending.key)) { p.items.push(toEntry(S.pending)); savePlaylists(); } modal(""); render(); break; }
    case "plnew": { const nm = $("#newPl").value.trim().slice(0, 40); if (!nm) break; S.playlists.push({ id: Date.now(), name: nm, items: [toEntry(S.pending)] }); savePlaylists(); modal(""); render(); break; }
    case "plcreate": { const nm = $("#plName").value.trim().slice(0, 40); if (nm) { S.playlists.push({ id: Date.now(), name: nm, items: [] }); savePlaylists(); render(); } break; }
    case "pldel": S.playlists = S.playlists.filter(p => String(p.id) !== String(S.lib.group) || p.id === 1); savePlaylists(); S.lib.group = null; render(); break;
    case "close": modal(""); break;
    case "rcat": S.radio.cat = k; render(); break;
    case "rplay": { const pl = S.radioItems.filter(s => s.type === "audio"); playQueue(pl.map(stationItem), pl.indexOf(S.radioItems[i])); break; }
    case "ropen": openExternal(S.radioItems[i].url); break;
    case "shuffle": { const pl = radioView().filter(s => s.type === "audio"); if (pl.length) playQueue(pl.map(stationItem), Math.floor(Math.random() * pl.length)); break; }
    case "tvsel": tvSelect(k); break;
    case "tvreload": tvSelect(S.tv.sel); break;
    case "tvfree": S.tv.freeOn = k === "1"; store.set("av.tv.free", S.tv.freeOn); if (!S.tv.freeOn && String(S.tv.sel).startsWith("p")) { tvStop(); Object.assign(S.tv, { sel: null, channels: [], err: "", playing: null }); } render(); break;
    case "tvremove": S.tv.sources = S.tv.sources.filter(s => s.id !== S.tv.sel); Object.assign(S.tv, { sel: null, channels: [], err: "" }); render(); break;
    case "tvadult": S.tv.showAdult = !S.tv.showAdult; store.set("av.tv.adult", S.tv.showAdult); tvSelect(S.tv.sel); break;
    case "tvgroup": S.tv.group = k || null; render(); break;
    case "tvplay": tvPlay(S.tvItems[i]); break;
    case "tvprev": tvStep(-1); break; case "tvnext": tvStep(1); break;
    case "tvstop": tvStop(); { const v = $("#tvVideo"); v && (v.pause(), v.removeAttribute("src"), v.load()); } S.tv.playing = null; render(); break;
    case "tvadd": modal(`<h3>Add a playlist</h3>
      <div class="mut" style="font-size:12px">Paste an M3U link, paste M3U text / a list of links, or open an .m3u file. Provider links often block browsers; the Android app has no such limit.</div>
      <input type="text" id="tvName" placeholder="Name (e.g. Gamma)" maxlength="30" style="margin-top:8px">
      <input type="password" id="tvUrl" placeholder="M3U link" style="margin-top:6px" autocomplete="off">
      <div class="mut" style="font-size:12px;margin-top:6px">Kept for this tab only and never saved in the browser, so your login doesn't stay on this computer. For a saved, encrypted list use the Android app.</div>
      <div class="row" style="margin-top:8px"><button class="pri" data-act="tvsave">Save link</button><button data-act="tvfile">Open .m3u / .txt file</button></div>
      <textarea id="tvPaste" placeholder="…or paste M3U text or links here (one per line)" style="margin-top:10px"></textarea>
      <div class="row" style="margin-top:6px"><button data-act="tvpaste">Import pasted list</button><span class="grow"></span><button data-act="close">Close</button></div><div class="warn" id="tvAddErr"></div>`); break;
    case "tvsave": { const err = tvAddLink($("#tvName").value.trim(), $("#tvUrl").value.trim()); if (err) $("#tvAddErr").textContent = err; else modal(""); break; }
    case "tvpaste": { const t = $("#tvPaste").value; const nm = $("#tvName").value.trim(); if (!t.trim()) break;
      if (/#EXTINF/i.test(t)) tvAddText(nm, t);
      else { const links = t.split(/\r?\n/).map(l => l.trim()).filter(l => /https?:\/\//i.test(l) && !l.startsWith("#"));
        const lists = [], chans = [];
        links.forEach(l => { const at = Math.max(l.toLowerCase().lastIndexOf("http://"), l.toLowerCase().lastIndexOf("https://")); const url = l.slice(at).split(" ")[0]; const label = l.slice(0, at).replace(/[\s,|;:\-]+$/, "").trim();
          (/\.m3u(\?|$)|get\.php|type=m3u|output=m3u/i.test(url) ? lists : chans).push([label, url]); });
        lists.forEach(([label, url], j) => S.tv.sources.push({ id: "u" + Date.now() + j, name: (label || nm || "Playlist " + (j + 1)).slice(0, 30), url }));
        if (chans.length) tvAddText(nm || "Pasted channels", "#EXTM3U\n" + chans.map(([l, u], j) => `#EXTINF:-1,${l || "Channel " + (j + 1)}\n${u}`).join("\n"));
        else if (lists.length) tvSelect(S.tv.sources[S.tv.sources.length - 1].id);
        if (!lists.length && !chans.length) { $("#tvAddErr").textContent = "No links found"; break; } }
      modal(""); break; }
    case "tvfile": $("#m3uInput").click(); break;
    case "dplay": DJ.toggle(n); break;
    case "dload": pickForDeck(n); break;
    case "dcue": DJ.decks[n].el.pause(); DJ.decks[n].el.currentTime = 0; break;
    case "dnudge": DJ.decks[n].el.currentTime = Math.max(0, DJ.decks[n].el.currentTime + +el.dataset.v); break;
    case "dtempo0": DJ.decks[n].tempo = 1; DJ.decks[n].el.playbackRate = 1; render(); break;
    case "fade": DJ.fade(n); break;
    case "fadesec": S.dj.fadeSec = +k; render(); break;
    case "curve": S.dj.curve = k; DJ.apply(); render(); break;
    case "picksrc": S.pickSrc = k; renderPicker(); break;
    case "pick": DJ.load(S.pickDeck, S.pickItems[i]); modal(""); break;
    case "yt": pauseOthers("watch"); S.watch.yt = stations.filter(s => s.type === "tv" && s.ytChannel)[i].ytChannel; render(); break;
    case "ytopen": openExternal(stations.find(s => s.ytChannel === S.watch.yt)?.url); break;
    case "ytclose": S.watch.yt = null; render(); break;
    case "wopen": openExternal(stations.filter(s => WATCH_CATS.has(s.cat) && s.type !== "tv")[i].url); break;
    case "vidopen": $("#vidInput").click(); break;
    case "vidplay": playVideo(S.videos[i].file); break;
  }
});
document.addEventListener("input", e => {
  const t = e.target, id = t.id;
  if (id === "libQ") { S.lib.q = t.value; refocus(id); }
  else if (id === "radioQ") { S.radio.q = t.value; refocus(id); }
  else if (id === "tvQ") { S.tv.q = t.value; refocus(id); }
  else if (id === "fader") { cancelAnimationFrame(DJ.raf); S.dj.fading = false; let x = t.value / 1000; if (Math.abs(x - .5) < .025) x = .5; S.dj.fader = x; DJ.apply(); syncDj(); }
  else if (id.startsWith("dtempo")) { const d = DJ.decks[+t.dataset.deck]; d.tempo = Math.round(t.value / 5) * 5 / 1000; d.el.playbackRate = d.tempo; }
  else if (id.startsWith("dtrim")) { DJ.decks[+t.dataset.deck].trim = t.value / 100; DJ.apply(); }
  else if (id.startsWith("dseek")) { const d = DJ.decks[+t.dataset.deck]; if (isFinite(d.el.duration)) d.el.currentTime = t.value / 1000 * d.el.duration; }
});
document.addEventListener("change", e => { if (/^dtempo|^dtrim/.test(e.target.id)) render(); });
function refocus(id){ render(); const el = $("#" + id); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
let vidUrl = null;
function playVideo(file){ pauseOthers("watch"); S.watch.video = { name: file.name }; render(); const v = $("#watchVideo"); if (vidUrl) URL.revokeObjectURL(vidUrl); v.src = vidUrl = URL.createObjectURL(file); v.play().catch(() => {}); }

// hidden pickers
document.body.insertAdjacentHTML("beforeend", `<input type="file" id="dirInput" webkitdirectory multiple hidden>
  <input type="file" id="m3uInput" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/x-mpegurl,text/plain" hidden>
  <input type="file" id="vidInput" accept="video/*" hidden>`);
$("#dirInput").onchange = e => filesPicked(e.target.files);
$("#vidInput").onchange = e => e.target.files[0] && playVideo(e.target.files[0]);
$("#m3uInput").onchange = async e => { const f = e.target.files[0]; if (!f) return; const t = await f.text(); modal("");
  if (/#EXTINF/i.test(t)) tvAddText(f.name.replace(/\.(m3u8?|txt)$/i, ""), t);
  else { tvAddText(f.name.replace(/\.(m3u8?|txt)$/i, ""), "#EXTM3U\n" + t.split(/\r?\n/).filter(l => /^https?:\/\//i.test(l.trim())).map((u, j) => `#EXTINF:-1,Channel ${j + 1}\n${u.trim()}`).join("\n")); }
  e.target.value = ""; };

render();
rescan(false);
</script>
</body>
